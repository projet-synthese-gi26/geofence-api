# docker-compose.prod.yml -- Production (serveur du prof)
# PostgreSQL est géré en externe, non inclus ici

services:
  redis:
    image: redis:7-alpine
    container_name: geofence-redis-prod
    volumes:
      - redis_prod_data:/data
    networks:
      - geofence-network
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_IMAGE:-geofence-service:latest}
    container_name: geofence-api-prod
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_LIQUIBASE_USERNAME: ${DB_LIQUIBASE_USERNAME}
      DB_LIQUIBASE_PASSWORD: ${DB_LIQUIBASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"
    ports:
      - "8080:8080"
    volumes:
      - uploads_prod_data:/app/uploads
      - ./logs:/app/logs
    networks:
      - geofence-network
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: geofence-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - geofence-network
    depends_on:
      - api
    restart: always
    profiles:
      - nginx

volumes:
  redis_prod_data:
  uploads_prod_data:

networks:
  geofence-network:
    driver: bridge
