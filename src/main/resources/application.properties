spring.application.name=geofence
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:yowyob}
spring.datasource.username=${DB_USERNAME:geofence_app}
spring.datasource.password=${DB_PASSWORD:app_password}
# Liquibase gère le schéma — JPA ne touche pas à la DDL
spring.jpa.hibernate.ddl-auto=none

# Liquibase (user dédié DDL, séparé de l'user applicatif)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:yowyob}
spring.liquibase.user=${DB_LIQUIBASE_USERNAME:geofence_liquibase}
spring.liquibase.password=${DB_LIQUIBASE_PASSWORD:liquibase_password}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect

# Desactiver la securite Servlet auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Forcer l'utilisation de Netty (serveur reactif)
spring.main.web-application-type=reactive

# Port pour Netty
server.port=${SERVER_PORT:8080}

server.error.include-exception=true
server.error.include-message=always
server.error.include-stacktrace=always


jwt.encryption.key=${JWT_ENCRYPTION_KEY:608f36e92dc66d97d5933f0e6371893cb4fc05b3aa8f8de64014732472303a7c}

# Configuration pour le telechargement de fichiers
file.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuration pour les requêtes JSON
spring.webflux.multipart.max-in-memory-size=10MB
server.max-http-request-size=10MB
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.multi-tenant.default-tenant-id=${DEFAULT_TENANT_ID:frontend-app}
app.multi-tenant.default-tenant-name=${DEFAULT_TENANT_NAME:Frontend Application}

# Bootstrap tenant/admin par défaut
app.bootstrap.admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${DEFAULT_ADMIN_EMAIL:admin@frontend.local}
app.bootstrap.admin.phone=${DEFAULT_ADMIN_PHONE:+237600000000}
app.bootstrap.admin.password=${DEFAULT_ADMIN_PASSWORD:Admin@123}
app.bootstrap.admin.firstname=${DEFAULT_ADMIN_FIRSTNAME:Frontend}
app.bootstrap.admin.lastname=${DEFAULT_ADMIN_LASTNAME:Admin}
app.bootstrap.admin.dob=${DEFAULT_ADMIN_DOB:1990-01-01}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,env,loggers
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Metrics Configuration
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Health Check
management.health.redis.enabled=true
management.health.db.enabled=true

# Info Endpoint
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=false
