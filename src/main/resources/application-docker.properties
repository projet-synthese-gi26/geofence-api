# application-docker.properties -- profil actif en conteneur Docker

spring.application.name=geofence
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:yowyob}
spring.datasource.username=${DB_USERNAME:geofence_app}
spring.datasource.password=${DB_PASSWORD:app_password}
# Liquibase gère le schéma — JPA ne touche pas à la DDL
spring.jpa.hibernate.ddl-auto=none

# Liquibase (user dédié DDL, séparé de l'user applicatif)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:yowyob}
spring.liquibase.user=${DB_LIQUIBASE_USERNAME:geofence_liquibase}
spring.liquibase.password=${DB_LIQUIBASE_PASSWORD:liquibase_password}
spring.jpa.show-sql=true
# JPA -- Liquibase gère le schéma, Hibernate ne touche pas à la DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Fichiers
file.upload-dir=${UPLOAD_DIR:/app/uploads}

# Application
app.frontend.url=${FRONTEND_URL}
server.port=${SERVER_PORT:8080}

# JWT
jwt.encryption.key=${JWT_ENCRYPTION_KEY}

# Logs
logging.level.root=INFO
logging.level.ink.yowyob.geofence=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Netty
server.netty.connection-timeout=20s
server.netty.idle-timeout=60s
